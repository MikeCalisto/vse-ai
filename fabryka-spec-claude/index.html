<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#7c3aed">
<title>Спец-ціна завершилась · Фабрика АІ контенту</title>
<meta name="description" content="Час дії спеціальної ціни 2999 грн на курс «Фабрика АІ контенту» завершився." />
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;800;900&family=Unbounded:wght@700;800;900&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --accent:#7c3aed;
  --accent2:#a855f7;
  --accent3:#c084fc;
  --paper:#f5f1fa;
  --cream:#ece6f5;
  --font:'Jost',-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif;
  --font-stamp:'Unbounded','Jost',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:radial-gradient(140% 90% at 50% 0%, #160830 0%, #0a0414 55%, #000000 100%);
  min-height:100vh;
  color:var(--cream);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.wrap{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:32px 22px;
}
.card{
  position:relative;
  width:100%;max-width:480px;
  padding:40px 28px 32px;
  background:linear-gradient(160deg, rgba(168,85,247,.1) 0%, rgba(10,4,24,.95) 70%);
  border:1px solid rgba(168,85,247,.4);
  border-radius:24px;
  box-shadow:0 30px 80px rgba(168,85,247,.35), 0 0 0 1px rgba(255,255,255,.04) inset;
  text-align:center;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 110%, rgba(168,85,247,.25), transparent 70%);
  pointer-events:none;
}
.card > *{position:relative}

.icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:78px;height:78px;border-radius:50%;
  background:linear-gradient(135deg, rgba(168,85,247,.25), rgba(252,165,250,.12));
  border:1px solid rgba(192,132,252,.5);
  font-size:2.2rem;line-height:1;
  margin-bottom:20px;
  box-shadow:0 12px 30px rgba(168,85,247,.4);
}

.eyebrow{
  display:inline-block;
  padding:6px 14px;border-radius:999px;
  background:rgba(252,165,250,.12);
  border:1px solid rgba(252,165,250,.4);
  color:#fca5fa;
  font-family:'Space Mono',ui-monospace,Menlo,monospace;
  font-size:.65rem;letter-spacing:.18em;
  text-transform:uppercase;font-weight:700;
  margin-bottom:18px;
}

h1{
  font-family:var(--font-stamp);
  font-weight:800;
  font-size:clamp(1.5rem, 7vw, 2.1rem);
  line-height:1.1;
  letter-spacing:-.03em;
  color:#fff;
  margin-bottom:14px;
}
h1 em{
  font-style:normal;
  background:linear-gradient(100deg, var(--accent2) 0%, var(--accent3) 50%, #fff 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}

p.lead{
  font-size:1rem;line-height:1.6;
  color:rgba(236,230,245,.85);
  margin-bottom:26px;
}
p.lead b{color:#fff;font-weight:700}

.divider{
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(168,85,247,.35), transparent);
  margin:6px 0 24px;
}

.cta{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:17px 22px;
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color:#fff;text-decoration:none;
  border-radius:14px;
  font-family:var(--font-stamp);font-weight:800;
  font-size:.92rem;letter-spacing:.04em;line-height:1;
  text-transform:uppercase;
  box-shadow:0 12px 28px rgba(124,58,237,.45), inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .25s, box-shadow .25s;
}
.cta:hover{transform:translateY(-2px);box-shadow:0 18px 38px rgba(168,85,247,.55)}
.cta .arrow{
  width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.22);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:.95rem;
  transition:transform .25s;
}
.cta:hover .arrow{transform:translateX(3px)}

.support{
  margin-top:18px;
  font-size:.82rem;
  color:rgba(236,230,245,.55);
  line-height:1.5;
}
.support a{
  color:var(--accent3);font-weight:700;
  text-decoration:none;
  border-bottom:1px solid rgba(192,132,252,.45);
}
.support a:hover{color:#fff;border-bottom-color:#fff}

.brand{
  margin-top:26px;padding-top:18px;
  border-top:1px dashed rgba(168,85,247,.22);
  font-family:'Space Mono',ui-monospace,Menlo,monospace;
  font-size:.62rem;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(236,230,245,.4);
}
.brand b{color:var(--accent3);font-weight:700}

@media (prefers-reduced-motion:no-preference){
  .icon{animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
  }
}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <div class="icon" aria-hidden="true">⏰</div>

    <div class="eyebrow">Час спливли</div>

    <h1>Час дії <em>спеціальної ціни</em><br>завершився</h1>

    <p class="lead">
      Знижка на курс <b>«Фабрика АІ&nbsp;контенту»</b> за&nbsp;<b>2 999&nbsp;грн</b>
      діяла обмежений час і вже не доступна.
    </p>

    <div class="divider"></div>

    <a href="https://vse-ai.vercel.app/fabryka-ai-kontentu/" class="cta">
      <span>Подивитись курс</span>
      <span class="arrow">→</span>
    </a>

    <p class="support">
      Виникли питання чи особлива ситуація?<br>
      Пиши в підтримку — <a href="https://t.me/ai_sashka_support">@ai_sashka_support</a>
    </p>

    <div class="brand">VSE&nbsp;AI&nbsp;·&nbsp;<b>Фабрика АІ контенту</b></div>
  </main>
</div>
</body>
</html>
